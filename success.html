<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI2Edu — Заказ успешно оформлен</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16162E">
<link rel="icon" href="./favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16162E;
  --paper:#ECEAF3;
  --surface:#F7F6FB;
  --line:#C9C5DA;
  --muted:#56546F;
  --action:#E8B23A;
  --radius:14px;
  --gutter:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.45;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  max-width:440px;
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:36px 24px;
  text-align:center;
}
.icon{
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--ink);
  color:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin:0 auto 20px;
}
h1{font-weight:900;font-size:24px;margin-bottom:12px;letter-spacing:-.02em}
p{color:var(--muted);font-size:15px;margin-bottom:24px}
.btn{
  display:block;
  width:100%;
  padding:15px;
  border-radius:var(--radius);
  background:var(--ink);
  color:var(--paper);
  text-decoration:none;
  font-weight:600;
  font-size:15px;
  transition:opacity .2s;
}
.btn:hover{opacity:.9}
.support{margin-top:18px;font-size:13.5px;color:var(--muted)}
.support a{color:var(--ink);font-weight:600}
</style>
</head>
<body>

<div class="card">
  <div class="icon">✓</div>
  <h1>Заказ успешно оформлен</h1>
  <p>Доступ к материалам платформы активирован. Подтверждение и ссылка отправлены на вашу электронную почту.</p>
  <a class="btn" href="https://t.me/ai2edu_bot" target="_blank" rel="noopener">Перейти в Telegram-канал</a>
  <div class="support">
    Вопросы по заказу: <a href="https://t.me/ai2edu_bot" target="_blank">@ai2edu_bot</a>
  </div>
</div>

</body>
</html>
